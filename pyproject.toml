[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "craaft"
description = "Python client for the Craaft API."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    {name = "Sean Nieuwoudt", email = "sean@underwulf.com"}
]
keywords = ["craaft", "api", "sdk", "client"]
dynamic = ["version"]
dependencies = ["requests>=2.32"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
]

[project.urls]
Homepage = "https://craaft.io"
Source = "https://github.com/craaft/python-sdk"
Issues = "https://github.com/craaft/python-sdk/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "responses>=0.25",
    "mypy>=1.10",
    "ruff>=0.6",
    "types-requests",
]

[tool.hatch.version]
path = "src/craaft/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/craaft"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM", "RUF"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
disallow_untyped_defs = true
files = ["src/craaft"]
